name: CI

on:
  push:
    # 两个名字都列上不是保险习惯，是实测：本仓库当前分支叫 master（`git branch
    # --show-current` 今天实跑），只写 main 的话推上去这个工作流一条都不会跑，
    # 而"CI 绿了"这句话看起来完全成立。将来改名成 main 也不用再动这个文件。
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.backend }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 三个后端都要绿：这个库不该有任何平台相关的东西。一个后端过、
        # 另一个后端不过，说明代码里混进了只在某个运行时装得起来的行为。
        # native 不在这里：`x/fs` 带 C stub，编译它要有 C 编译器，
        # 那条路径交给下面的命令行作业，它本来就要跑真文件。
        include:
          - backend: wasm
            target: wasm
          - backend: javascript
            target: js
          - backend: wasm-gc
            target: wasm-gc
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain version
        run: moon version --all

      - name: moon fmt 之后不该再有 diff
        run: |
          moon fmt
          git diff --exit-code || { echo "请先运行 moon fmt"; exit 1; }

      - name: moon info 之后不该再有 diff
        run: |
          moon info
          git diff --exit-code || { echo "请提交 moon info 生成的 pkg.generated.mbti"; exit 1; }

      - name: Test (${{ matrix.backend }})
        run: moon test --target ${{ matrix.target }}

  coverage:
    name: 覆盖率
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Test with coverage
        run: moon test --enable-coverage

      - name: Summary
        run: moon coverage analyze -- -f summary

  cli:
    name: 命令行端到端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet pillow

      # 造 fixture、读回、比对，全部走仓库里的脚本：
      # CI 里写内联 python 的话，本地就没法同一条命令复现同一次失败。
      - name: 用 Pillow 造一份带 EXIF 的真实 JPEG/PNG
        run: python ci/make_fixture.py /tmp/fix

      - name: 独立第二意见：Pillow 必须读到我们写进去的东西
        run: python ci/assert_pillow_reads.py /tmp/fix

      - name: read / audit / redact / strip
        run: |
          moon run cmd/main -- read /tmp/fix/cross.jpg
          moon run cmd/main -- audit /tmp/fix/cross.jpg --policy strict
          moon run cmd/main -- redact /tmp/fix/cross.jpg --policy strict
          moon run cmd/main -- redact /tmp/fix/cross.png --policy strict
          moon run cmd/main -- strip /tmp/fix/cross.jpg
          moon run cmd/main -- strip /tmp/fix/cross.png
          # 两种带 XMP 的形状：EXIF+XMP，以及只有 XMP 没有 EXIF。
          # 后者的逐条清单天然是空的，只看清单的工具会在这里报"无事可做"。
          moon run cmd/main -- read /tmp/fix/cross_xmp.jpg
          moon run cmd/main -- audit /tmp/fix/cross_xmp.jpg --policy strict
          moon run cmd/main -- redact /tmp/fix/cross_xmp.jpg --policy strict
          moon run cmd/main -- strip /tmp/fix/cross_xmp.jpg
          moon run cmd/main -- redact /tmp/fix/xmp_only.jpg --policy strict
          moon run cmd/main -- strip /tmp/fix/xmp_only.jpg
          # 裸 TIFF 那两份是 --keep-bytes 这一对的对照两端：cross.tiff 本来就没有
          # 元数据，原位模式在这里只能"无事可做、原样交回"；bare_gps.tiff 带着
          # 身份/时间/序列号/经纬度，strict 命中 7 条，才是真让引擎落笔的那一份。
          # 没有后一份，CI 上那条原位路一次改写都没执行过。产物显式 -o 到语料之外，
          # 免得下一关把它当多出来的一份语料扫。
          mkdir -p /tmp/keepbytes
          moon run cmd/main -- redact /tmp/fix/cross.tiff --keep-bytes --policy strict -o /tmp/keepbytes/cross.redacted.tif
          moon run cmd/main -- strip /tmp/fix/cross.tiff --keep-bytes -o /tmp/keepbytes/cross.stripped.tif
          moon run cmd/main -- redact /tmp/fix/bare_gps.tiff --keep-bytes --policy strict -o /tmp/keepbytes/bare_gps.redacted.tif
          moon run cmd/main -- strip /tmp/fix/bare_gps.tiff --keep-bytes -o /tmp/keepbytes/bare_gps.stripped.tif

      - name: 用 Pillow 验收脱敏结果
        run: python ci/assert_redacted.py /tmp/fix

      # 真实语料不在仓库里，完整对拍 CI 跑不了；但这两关仍要跑：
      # 上一关把对拍脚本对准那五份 fixture，让它的三道闸（XMP 残留、
      # `xmp` 键与字节的双向复核、量尺归因）真的被执行——脚本自己坏了也要能红；
      # 再下一关用合成输入钉住那三条归因判据：它们一旦被改宽，红会悄悄变成绿。
      - name: 对拍脚本对准 fixture 跑一遍
        run: python ci/crosscheck_real.py /tmp/fix -o /tmp/cross

      - name: 归因判据不许被悄悄改宽
        run: python ci/crosscheck_selftest.py

      # 原位改写（--keep-bytes）那一腿的独立门禁：脚本自己走一遍 IFD 链、按
      # TIFF 6.0 的宽度表预言该删哪几条、该碰哪些字节，再逐字节核引擎交出的
      # 产物。外来语料（104 份陌生 TIFF）不在仓库里，CI 跑不了那一批；但这个
      # 脚本的判据本身必须在 CI 上被执行一次——否则它就成了只有某台机器上
      # 那句话算数、文档里写"有这道门禁"却没人跑的守卫。
      # 两条腿各用各的输出目录：strict 与 strip 的产物同名（cross.inplace.tiff），
      # 共用会互相盖掉；而且输出目录必须在语料目录之外，否则下一轮把上一轮的
      # 产物当语料扫，分母就被自己的产物顶上去了。
      - name: 原位对拍（strict 腿）
        run: python ci/inplace_crosscheck.py /tmp/fix -o /tmp/inplace --policy strict

      - name: 原位对拍（strip 腿）
        run: python ci/inplace_crosscheck.py /tmp/fix -o /tmp/inplace-strip --strip

      - name: 原位门禁自己有没有眼睛
        run: python ci/inplace_crosscheck.py --selftest

      # 七个注入驱动（ci/mutations/）要外来语料，CI 上跑不了；但替它们**收尾判定**
      # 的那一层是纯 python、不碰语料，必须在 CI 上被执行一次：判定器要是把某个驱动
      # 的正常收尾读成绿（或读成红），文档里那句"每处坏法都红过"就会在没人看日志的
      # 情况下继续成立——而这句话是这份申报书里唯一撑着"门禁不是装饰"的东西。
      - name: 变异判定器真值表
        run: python ci/mutations/run_all.py --selftest
